name: Stealth Lightbeacon Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Target URL to audit
        required: true
        type: string
      audits:
        description: Optional evaluator subset such as security,performance
        required: false
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SLB_TARGET_URL: ${{ inputs.target_url }}
      SLB_AUTH_TOKEN: ${{ secrets.SLB_AUTH_TOKEN }}
      SLB_AUDITS: ${{ inputs.audits }}
      SLB_FAIL_ON_CRITICAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python main.py evaluate --format both --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: stealth-lightbeacon-report
          path: |
            reports/report.json
            reports/report.html
            reports/report.pdf
