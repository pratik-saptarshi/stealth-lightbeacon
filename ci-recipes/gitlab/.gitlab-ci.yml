stages:
  - audit

audit:
  stage: audit
  image: python:3.11
  variables:
    SLB_FAIL_ON_CRITICAL: "1"
  script:
    - export SLB_TARGET_URL="${SLB_TARGET_URL}"
    - export SLB_AUTH_TOKEN="${SLB_AUTH_TOKEN}"
    - export SLB_AUDITS="${SLB_AUDITS}"
    - pip install -r requirements.txt
    - python main.py evaluate --format both --out reports
  artifacts:
    when: always
    paths:
      - reports/report.json
      - reports/report.html
