[tool.pytest.ini_options]
minversion = "8.2.0"
addopts = "-ra -q --cov=modules --cov=crawler --cov=utils --cov-report=term-missing"
pythonpath = ["."]
testpaths = [
    "tests",
]
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
]

[tool.coverage.run]
branch = true
source = ["modules", "crawler", "utils"]
omit = [
    "tests/*",
    "main.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 64

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
