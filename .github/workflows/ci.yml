name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Upgraded from legacy 3.8/3.9
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --extra-index-url https://pypi.org/simple

    - name: Validate Dependency Resolution
      run: |
        python -m pip install pip-tools
        python scripts/validate_dependencies.py

    - name: Verify Bill of Materials (BOM) Consistency
      run: |
        python utils/update_bom.py
        git diff --exit-code bill-of-material.md

    - name: Install System Dependencies for Playwright (Mock Sandbox)
      run: |
        # Playwright tests are mocked in unit runs, but install package triggers imports
        playwright install-deps chromium || true

    - name: Run Test Suite with Coverage Enforcements
      run: |
        pytest -v

    - name: Export Companion OpenAPI Contract
      run: |
        python scripts/export_openapi.py
        git diff --exit-code contracts/backend-api.openapi.json
