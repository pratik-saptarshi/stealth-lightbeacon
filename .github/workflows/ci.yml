name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --extra-index-url https://pypi.org/simple

    - name: Verify Bill of Materials (BOM) Consistency
      run: |
        python utils/update_bom.py
        git diff --exit-code bill-of-material.md

    - name: Install System Dependencies for Playwright (Mock Sandbox)
      run: |
        # Playwright tests are mocked in unit runs, but install package triggers imports
        playwright install-deps chromium || true

    - name: Run Test Suite with Coverage Enforcements
      run: |
        pytest -v
