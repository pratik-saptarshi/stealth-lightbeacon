name: Dependabot BOM Sync

# Dependabot pip PRs change requirements.txt only; CI requires
# bill-of-material.md to stay in sync (utils/update_bom.py + git diff --exit-code).
# Regenerate and push the BOM back onto Dependabot PR branches so they can pass CI.
#
# Uses pull_request_target so the workflow runs in the base-repo context with a
# write-capable GITHUB_TOKEN (Dependabot-triggered pull_request runs get a
# read-only token). Restricted to dependabot[bot] and it only regenerates the
# BOM from the PR's requirements.txt.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  bom-sync:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate BOM and push if changed
        run: |
          python utils/update_bom.py
          if git diff --quiet -- bill-of-material.md; then
            echo "BOM already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bill-of-material.md
          git commit -m "chore(deps): sync bill-of-material.md"
          git push
